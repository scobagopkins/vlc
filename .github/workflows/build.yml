name: Build VLC Android TV

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Custom VLC TV APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: Download Gradle & Generate Wrapper
        run: |
          GRADLE_VERSION=8.13
          curl -sLO https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip
          python3 -c "import zipfile; zipfile.ZipFile('gradle-${GRADLE_VERSION}-bin.zip').extractall('.')"
          chmod +x ./gradle-${GRADLE_VERSION}/bin/gradle
          ./gradle-${GRADLE_VERSION}/bin/gradle wrapper
          chmod +x gradlew
          rm -rf gradle-${GRADLE_VERSION}-bin.zip

      - name: Setup local.properties and debug keystore
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" || true
          keytool -genkey -v -keystore /tmp/release.keystore -storepass android -alias androidreleasekey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=VLC Release,O=VideoLAN,C=US" || true

      - name: Build Application APK
        run: |
          ./gradlew assembleRelease --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VLC-Custom-TV-Debug
          path: application/app/build/outputs/apk/**/*.apk

      - name: Release APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/')
        with:
          tag_name: vlc-tv-custom-v3.4
          name: "VLC for Android TV (UPnP MediaRenderer + Home Sections v3.4 Release)"
          body: |
            ### VLC for Android TV v3.4 Release
            
            **Что исправлено в v3.4:**
            - **Исправлен UPnP DLNA Playback**: надёжный парсинг SOAP XML тегов CurrentURI (поддержка namespace-префиксов, CDATA и атрибутов).
            - **Корректный запуск PlaybackService**: запуск через AppScope(Dispatchers.Main), предотвращение гонки service.load + service.play и исключение повторного перезапуска плейлиста из AudioPlayerActivity.
            - **Флаг MEDIA_FORCE_AUDIO**: гарантированное воспроизведение сетевых HTTP аудиопотоков без расширений.
            - **Полноценный парсинг HTTP запросов по байтам**: защита от зависаний при несовпадении Content-Length и многобайтовых UTF-8 символов.
            - **Управление громкостью через AudioManager**: поддержка команд GetVolume, SetVolume, GetMute, SetMute в RenderingControl.
          files: application/app/build/outputs/apk/**/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
